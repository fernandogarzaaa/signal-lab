name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r packages/cli/engine/requirements.txt
          # gdelt-client (item 5): installed --no-deps because its
          # pandas>=3.0.0 metadata pin conflicts with tabpfn==2.0.6
          # (pandas<3). The DOC article_search path we use only needs
          # pandas DataFrame basics (verified on pandas 2.x); aiohttp and
          # tenacity are its runtime imports, installed explicitly.
          pip install --no-deps gdelt-client==0.2.2
          pip install "aiohttp>=3.13.3" "tenacity>=9.1.3"
          pip install pytest
          pip install -e .
      - name: Run test suite
        run: python -m pytest tests/ -v
      - name: Audit for stubs and placeholders
        run: |
          set -e
          ! grep -rn "NotImplementedError" src/ --include="*.py"
          ! grep -rniE "TODO|FIXME|XXX" src/ --include="*.py"
          echo "audit clean"

  node-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pack npm tarball
        run: |
          cd packages/cli
          npm pack
          TARBALL="signallab-$(node -p "require('./package.json').version").tgz"
          test -f "$TARBALL"
          tar tzf "$TARBALL" | grep -q "package/bin/signallab.js"
          tar tzf "$TARBALL" | grep -q "package/engine/seed_data/signal_lab.duckdb"
          echo "tarball contents verified"
