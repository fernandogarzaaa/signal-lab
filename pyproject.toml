[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lab"
version = "0.5.0"
description = "News-sentiment market event engine (LSEG interview prep)"
requires-python = ">=3.10"
# Runtime dependencies imported at module level by signal_lab.
# lightgbm is required: the shipped production model.pkl is a LightGBM
# classifier. pandas stays <3 because the optional tabpfn==2.0.6 arm needs it.
dependencies = [
    "pandas>=2.0,<3",
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "duckdb>=0.9",
    "joblib>=1.3",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "yfinance>=0.2",
    "lightgbm>=4.7.0",
]

[project.optional-dependencies]
# spaCy NER upgrade (extract_ner); also run: python -m spacy download en_core_web_sm
nlp = ["spacy>=3.7"]
# TabPFN benchmark arm. Heavy: pulls torch (and CUDA wheels on Linux).
tabpfn = ["tabpfn==2.0.6"]
# GDELT client runtime imports. gdelt-client itself must be installed with
# --no-deps (its pandas>=3 pin conflicts with tabpfn): pip install --no-deps gdelt-client==0.2.2
gdelt = ["aiohttp>=3.13.3", "tenacity>=9.1.3"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lab = ["nlp/data/*.csv", "models/data/*.json"]
