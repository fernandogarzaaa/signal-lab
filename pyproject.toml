[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-lab"
version = "0.3.0"
description = "News-sentiment market event engine (LSEG interview prep)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
signal_lab = ["nlp/data/*.csv", "models/data/*.json"]
